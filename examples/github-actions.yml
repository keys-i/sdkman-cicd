name: Build with SDKMAN

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdkman-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out application
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build with repository SDKs
        uses: keys-i/sdkman-cicd@v1.2.3
        with:
          run: ./gradlew test

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: test-reports-${{ github.run_attempt }}
          path: '**/build/test-results/test/*.xml'
          if-no-files-found: warn
          retention-days: 7
