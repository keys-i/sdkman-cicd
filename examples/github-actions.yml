name: Build with SDKMAN

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdkman-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ${{ vars.SDKMAN_CI_IMAGE }}
      # GitHub mounts directories that the image's default user cannot write
      options: --user 0
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out application
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Prepare SDK cache
        run: |
          test -s .sdkmanrc
          # Use the workspace path inside the job container
          printf 'SDKMAN_CANDIDATES_DIR=%s/.cache/sdkman/candidates\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Restore SDK candidates
        id: candidates
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SDKMAN_CANDIDATES_DIR }}
          key: sdkman-app-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.event_name }}-${{ vars.SDKMAN_CI_IMAGE }}-${{ hashFiles('.sdkmanrc') }}

      - name: Install missing candidates
        timeout-minutes: 10
        run: |
          sdk env || sdk env install
          bash -e -o pipefail -c 'sdk env'

      - name: Save validated SDK candidates
        if: steps.candidates.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SDKMAN_CANDIDATES_DIR }}
          key: ${{ steps.candidates.outputs.cache-primary-key }}

      - name: Build and test
        run: sdk env && ./gradlew test
