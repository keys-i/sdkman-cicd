name: Validate CI image

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
    inputs:
      architecture:
        description: Image architectures to build and test
        type: choice
        options: [amd64, arm64, both]
        default: amd64
      no_cache:
        description: Rebuild without cached image layers
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: validate-image-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.architecture || 'amd64' }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        architecture: >-
          ${{ fromJSON('{"amd64":["amd64"],"arm64":["arm64"],"both":["amd64","arm64"]}')[
            inputs.architecture ||
            (github.event_name == 'schedule' && github.event.repository.visibility == 'public' && 'both' || 'amd64')
          ] }}
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    env:
      IMAGE_ARCH: ${{ matrix.architecture }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run offline checks
        run: bash .github/workflowes/scripts/check.sh

      - name: Lint GitHub workflows
        run: bash .github/workflowes/scripts/lint-workflows.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and load image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          platforms: linux/${{ env.IMAGE_ARCH }}
          tags: sdkman-ci:test
          load: true
          push: false
          pull: true
          no-cache: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.no_cache) }}
          build-args: BUILDKIT_DOCKERFILE_CHECK=error=true
          cache-from: type=gha,version=2,scope=sdkman-ci-pr-${{ env.IMAGE_ARCH }}
          cache-to: type=gha,version=2,scope=sdkman-ci-pr-${{ env.IMAGE_ARCH }},mode=max

      - name: Check image and candidate cache
        timeout-minutes: 10
        env:
          EXPECTED_PLATFORM: linux/${{ env.IMAGE_ARCH }}
        run: bash .github/workflowes/scripts/check-image.sh sdkman-ci:test

      - name: Scan the tested image
        id: scan
        timeout-minutes: 10
        shell: bash
        run: |
          docker image save --output "$RUNNER_TEMP/test-image.tar" sdkman-ci:test
          bash .github/workflowes/scripts/scan-image.sh "$RUNNER_TEMP/test-image.tar" 2>&1 | tee "$RUNNER_TEMP/scan-report.txt"

      - name: Upload the scan report
        if: ${{ !cancelled() && (steps.scan.outcome == 'success' || steps.scan.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: scan-report-${{ matrix.architecture }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scan-report.txt
          if-no-files-found: warn
          retention-days: 7
