name: Validate CI image

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
    inputs:
      no_cache:
        description: Rebuild without cached image layers
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: validate-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run offline checks
        run: bash scripts/check.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and load image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: sdkman-ci:test
          load: true
          push: false
          pull: true
          no-cache: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.no_cache) }}
          build-args: BUILDKIT_DOCKERFILE_CHECK=error=true
          cache-from: type=gha,scope=sdkman-ci-pr-amd64
          cache-to: type=gha,scope=sdkman-ci-pr-amd64,mode=max

      - name: Check image and candidate cache
        timeout-minutes: 10
        run: bash scripts/check-image.sh sdkman-ci:test
