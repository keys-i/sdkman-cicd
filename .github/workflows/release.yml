name: Publish release image

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  TEST_IMAGE: sdkman-ci:${{ github.event.release.tag_name }}

concurrency:
  group: publish-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-test:
    name: Build and test release (amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PUBLISH_IMAGE: docker.io/${{ vars.DOCKERHUB_REPOSITORY }}:${{ github.event.release.tag_name }}
    outputs:
      image-id: ${{ steps.export.outputs.image-id }}
      archive-sha256: ${{ steps.export.outputs.archive-sha256 }}
      artifact-name: ${{ steps.export.outputs.artifact-name }}
      publish-image: ${{ steps.export.outputs.publish-image }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate the release tag for Docker Hub
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: bash .github/workflowes/scripts/validate-release-tag.sh "$RELEASE_TAG"

      - name: Check Docker Hub variables
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
        run: |
          : "${DOCKERHUB_USERNAME:?Set the DOCKERHUB_USERNAME repository variable}"
          : "${DOCKERHUB_REPOSITORY:?Set the DOCKERHUB_REPOSITORY repository variable to namespace/repository}"
          bash .github/workflowes/scripts/validate-dockerhub-repository.sh "$DOCKERHUB_REPOSITORY"

      - name: Run offline checks
        run: bash .github/workflowes/scripts/check.sh

      - name: Lint GitHub workflows
        run: bash .github/workflowes/scripts/lint-workflows.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and load release image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          platforms: linux/amd64
          tags: ${{ env.TEST_IMAGE }}
          labels: |
            org.opencontainers.image.version=${{ github.event.release.tag_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          load: true
          push: false
          pull: true
          no-cache: true
          build-args: BUILDKIT_DOCKERFILE_CHECK=error=true

      - name: Check image and candidate cache
        timeout-minutes: 10
        env:
          EXPECTED_PLATFORM: linux/amd64
        run: bash .github/workflowes/scripts/check-image.sh "$TEST_IMAGE"

      - name: Export the tested image
        id: export
        run: |
          image_id=$(docker image inspect --format '{{.Id}}' "$TEST_IMAGE")
          docker image save --output "$RUNNER_TEMP/release-image.tar" "$TEST_IMAGE"
          archive_sha256=$(sha256sum "$RUNNER_TEMP/release-image.tar")
          printf '%s\n' \
            "archive-sha256=${archive_sha256%% *}" \
            "image-id=$image_id" \
            "artifact-name=release-image-$GITHUB_RUN_ATTEMPT" \
            "publish-image=$PUBLISH_IMAGE" >> "$GITHUB_OUTPUT"
          printf '### Tested release image\n\nDestination:\n\n    %s\n\nImage ID:\n\n    %s\n\nArchive SHA-256:\n\n    %s\n' \
            "$PUBLISH_IMAGE" "$image_id" "${archive_sha256%% *}" >> "$GITHUB_STEP_SUMMARY"

      - name: Scan the tested image
        id: scan
        timeout-minutes: 10
        shell: bash
        run: bash .github/workflowes/scripts/scan-image.sh "$RUNNER_TEMP/release-image.tar" 2>&1 | tee "$RUNNER_TEMP/scan-report.txt"

      - name: Upload the scan report
        if: ${{ !cancelled() && (steps.scan.outcome == 'success' || steps.scan.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: scan-report-amd64-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scan-report.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Generate the release SBOM
        timeout-minutes: 10
        env:
          EXPECTED_IMAGE_ID: ${{ steps.export.outputs.image-id }}
        run: bash .github/workflowes/scripts/sbom-image.sh "$RUNNER_TEMP/release-image.tar" "$EXPECTED_IMAGE_ID" > "$RUNNER_TEMP/sbom.cdx.json"

      - name: Upload the release SBOM
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: release-sbom-amd64-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sbom.cdx.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload the tested image
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: ${{ steps.export.outputs.artifact-name }}
          path: ${{ runner.temp }}/release-image.tar
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish tested release
    needs: build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: dockerhub
    env:
      PUBLISH_IMAGE: ${{ needs.build-test.outputs.publish-image }}
      EXPECTED_IMAGE_ID: ${{ needs.build-test.outputs.image-id }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check Docker Hub token
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: ': "${DOCKERHUB_TOKEN:?Set DOCKERHUB_TOKEN in the dockerhub environment}"'

      - name: Download the tested image
        uses: actions/download-artifact@v5
        timeout-minutes: 5
        with:
          name: ${{ needs.build-test.outputs.artifact-name }}
          path: ${{ runner.temp }}

      - name: Load the tested image
        working-directory: ${{ runner.temp }}
        env:
          EXPECTED_ARCHIVE_SHA256: ${{ needs.build-test.outputs.archive-sha256 }}
        run: |
          printf '%s  release-image.tar\n' "$EXPECTED_ARCHIVE_SHA256" | sha256sum --check --strict
          docker image load --input release-image.tar

      - name: Scan again before publishing
        id: scan
        timeout-minutes: 10
        shell: bash
        run: bash .github/workflowes/scripts/scan-image.sh "$RUNNER_TEMP/release-image.tar" 2>&1 | tee "$RUNNER_TEMP/scan-report.txt"

      - name: Upload the publish scan report
        if: ${{ !cancelled() && (steps.scan.outcome == 'success' || steps.scan.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        timeout-minutes: 5
        with:
          name: scan-report-publish-amd64-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scan-report.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Tag the tested image for Docker Hub
        run: docker image tag "$EXPECTED_IMAGE_ID" "$PUBLISH_IMAGE"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        timeout-minutes: 2
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          logout: true

      - name: Push the tested release image
        timeout-minutes: 5
        run: bash .github/workflowes/scripts/publish-image.sh
