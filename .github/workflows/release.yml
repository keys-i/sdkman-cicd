name: Validate release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate the release tag for Docker Hub
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: bash scripts/validate-release-tag.sh "$RELEASE_TAG"
