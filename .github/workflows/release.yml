name: Publish release image

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate the release tag for Docker Hub
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: bash scripts/validate-release-tag.sh "$RELEASE_TAG"

  build-test:
    name: Build, test, and publish release (amd64)
    needs: validate-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TEST_IMAGE: sdkman-ci:${{ github.event.release.tag_name }}
      PUBLISH_IMAGE: docker.io/${{ vars.DOCKERHUB_REPOSITORY }}:${{ github.event.release.tag_name }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check Docker Hub configuration
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          : "${DOCKERHUB_USERNAME:?Set the DOCKERHUB_USERNAME repository variable}"
          : "${DOCKERHUB_REPOSITORY:?Set the DOCKERHUB_REPOSITORY repository variable to namespace/repository}"
          : "${DOCKERHUB_TOKEN:?Set the DOCKERHUB_TOKEN repository secret}"
          bash scripts/validate-dockerhub-repository.sh "$DOCKERHUB_REPOSITORY"

      - name: Run offline checks
        run: bash scripts/check.sh

      - name: Lint GitHub workflows
        run: |
          docker run --rm --network none \
            --mount "type=bind,src=$PWD/.github/workflows,dst=/repo/.github/workflows,readonly" \
            --mount "type=bind,src=$PWD/examples,dst=/repo/examples,readonly" \
            --workdir /repo \
            docker.io/rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 \
            -color .github/workflows/*.yml examples/github-actions.yml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and load release image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: ${{ env.TEST_IMAGE }}
          labels: |
            org.opencontainers.image.version=${{ github.event.release.tag_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          load: true
          push: false
          pull: true
          build-args: BUILDKIT_DOCKERFILE_CHECK=error=true
          cache-from: type=gha,scope=sdkman-ci-release-amd64
          cache-to: type=gha,scope=sdkman-ci-release-amd64,mode=max

      - name: Check image and candidate cache
        timeout-minutes: 10
        run: bash scripts/check-image.sh "$TEST_IMAGE"

      - name: Tag the tested image for Docker Hub
        run: docker image tag "$TEST_IMAGE" "$PUBLISH_IMAGE"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        timeout-minutes: 2
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          logout: true

      - name: Push the tested release image
        timeout-minutes: 5
        run: bash scripts/publish-image.sh
