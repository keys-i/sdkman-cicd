name: Publish release image

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate the release tag for Docker Hub
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: bash scripts/validate-release-tag.sh "$RELEASE_TAG"

  build-test:
    name: Build, test, and publish release (amd64)
    needs: validate-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TEST_IMAGE: sdkman-ci:${{ github.event.release.tag_name }}
      PUBLISH_IMAGE: docker.io/${{ vars.DOCKERHUB_REPOSITORY }}:${{ github.event.release.tag_name }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check Docker Hub configuration
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          : "${DOCKERHUB_USERNAME:?Set the DOCKERHUB_USERNAME repository variable}"
          : "${DOCKERHUB_REPOSITORY:?Set the DOCKERHUB_REPOSITORY repository variable to namespace/repository}"
          : "${DOCKERHUB_TOKEN:?Set the DOCKERHUB_TOKEN repository secret}"

      - name: Lint shell scripts
        run: shellcheck docker/*.sh scripts/*.sh tests/*.sh

      - name: Test release tag validation
        run: bash tests/release-tag.sh

      - name: Test release publishing without a registry
        run: bash tests/publish-image.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and load release image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: ${{ env.TEST_IMAGE }}
          load: true
          push: false
          pull: true
          build-args: BUILDKIT_DOCKERFILE_CHECK=error=true
          cache-from: type=gha,scope=sdkman-ci-release-amd64
          cache-to: type=gha,scope=sdkman-ci-release-amd64,mode=max

      - name: Check the CLI and candidate cache configuration
        run: |
          docker run --rm --network none \
            --mount "type=bind,src=$PWD/tests,dst=/tests,readonly" \
            "$TEST_IMAGE" bash /tests/smoke.sh

      - name: Compile with fresh SDKs and reuse them offline
        timeout-minutes: 10
        run: |
          cache_volume=$(docker volume create)
          trap 'docker volume rm "$cache_volume"' EXIT
          for mode in install cached; do
            network=none
            if [[ "$mode" == install ]]; then network=bridge; fi
            docker run --rm --network "$network" \
              --mount "type=volume,src=$cache_volume,dst=/workspace" \
              --mount "type=bind,src=$PWD/tests,dst=/tests,readonly" \
              --env SDKMAN_CANDIDATES_DIR=/workspace/candidates \
              --workdir /tests \
              "$TEST_IMAGE" bash /tests/integration.sh "$mode"
          done

      - name: Tag the tested image for Docker Hub
        run: docker image tag "$TEST_IMAGE" "$PUBLISH_IMAGE"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        timeout-minutes: 2
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          logout: true

      - name: Push the tested release image
        timeout-minutes: 5
        run: bash scripts/publish-image.sh
